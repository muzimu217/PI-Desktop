name: Linux ARM64 package experiment

# Fork-only experiment: prove a Linux arm64 build is feasible before proposing
# anything upstream. Manual dispatch only; never runs on pushes or tags.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux arm64 packages
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Report runner architecture
        run: |
          uname -m
          cat /etc/os-release | head -2
          ldd --version | head -1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages (arm64 only)
        # The per-target "arch" arrays are removed from the linux config, so the
        # arch now comes from the CLI, mirroring how the macOS matrix passes
        # --arm64 / --x64. Keeping the arrays made electron-builder union the
        # configured arch with the CLI arch and emit both.
        run: pnpm --filter @pi-desktop/desktop run dist:linux -- --arm64

      - name: Verify Linux host glibc floor
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: List produced artifacts
        run: ls -la apps/desktop/release/

      - name: Smoke test the arm64 .deb on the arm64 runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xauth xvfb \
            libasound2 libgbm1 libsecret-1-0 imagemagick
          # GITHUB_WORKSPACE is the absolute repo path, so this resolves to a
          # real file path. apt-get treats an unprefixed relative path as a
          # *package name* and fails with "Unable to locate package ...", which
          # is what broke the previous run.
          deb=$(find "$GITHUB_WORKSPACE/apps/desktop/release" -maxdepth 1 -type f -name '*_arm64.deb' | head -1)
          echo "installing: $deb"
          sudo apt-get install --no-install-recommends -y "$deb"
          echo "--- installed pi-desktop files ---"
          dpkg -L pi-desktop 2>/dev/null | grep -E "pi-desktop" | head -20 || true
          echo "--- binary architecture ---"
          bin=$(command -v pi-desktop || true)
          [ -z "$bin" ] && bin=$(dpkg -L pi-desktop 2>/dev/null | grep -E "/pi-desktop$" | head -1)
          echo "launch binary: ${bin:-<not found>}"
          file "$bin" || true
          echo "--- launch under Xvfb :99 (40s) ---"
          # Manual Xvfb (no xvfb-run): fixed display number, no auth cookie to
          # hunt for, so the ImageMagick screenshot below can always connect.
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          sleep 2
          set +e
          DISPLAY=:99 timeout 40 "$bin" --no-sandbox --disable-gpu > /tmp/pi.log 2>&1 &
          app_pid=$!
          # Give the app time to boot the host-core backend and render, then
          # screenshot the real Xvfb root window while it is still running.
          sleep 30
          echo "--- capture screenshot ---"
          DISPLAY=:99 import -window root /tmp/pi_shot.png || true
          ls -la /tmp/pi_shot.png 2>/dev/null || true
          wait $app_pid || true
          code=$?
          set -e
          kill $xvfb_pid 2>/dev/null || true
          echo "exit code: $code (124 = still running when the timeout fired => launched OK)"
          echo "--- handshake check (host-core backend must boot) ---"
          if grep -q "host-core handshake ok" /tmp/pi.log; then
            echo "HANDSHAKE OK: host-core backend booted on arm64"
          else
            echo "HANDSHAKE MISSING: host-core backend never completed handshake"
            grep -E "backend boot failed|GLIBC|host" /tmp/pi.log | head -10 || true
            exit 1
          fi
          echo "--- log tail ---"
          tail -30 /tmp/pi.log || true
          if [ "$code" -eq 124 ] || [ "$code" -eq 0 ]; then
            echo "SMOKE TEST PASS: app launched and ran"
          else
            echo "SMOKE TEST FAIL: app exited with code $code"
            exit 1
          fi

      - name: Upload arm64 packages
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-linux-arm64-experiment
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/*.rpm
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage

      - name: Upload boot screenshot
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-arm64-boot-screenshot
          if-no-files-found: warn
          retention-days: 7
          path: /tmp/pi_shot.png
